    severity: low
    category: tech-debt
    type: risk
    file: internal/httpapi/server.go
    line: 118
    title: "409 booking_cancelled is answered on operations that do not declare it"
    description: |
      writeResponseError maps any handler error wrapping booking.ErrBookingCancelled to 409
      booking_cancelled for every operation, but no operation in api/openapi.yaml declares a 409
      response for bookings/{bookingId} or bookings/{bookingId}/cancel (they declare 200/404/500).
      The ErrorCode enum declares booking_cancelled (409) and ADR-0010 asks for a stable mapping
      even though no public route can trigger it, so this is unreachable in production today; if
      it ever fires it is a response outside the declared operation contract.
    suggestion: |
      Accept as is (ADR-0010 consequence), or when the contract next changes declare the 409 on
      the operations that can reach it. No change to api/ is allowed on this card.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: internal/booking/booking.go
    line: 49
    title: "Domain guard Booking.WithStatus has no production caller"
    description: |
      WithStatus is referenced only from tests; Service.Cancel calls
      Repository.UpdateBookingStatus directly, and that port accepts any target status, so the
      domain guard is not on any write path. ADR-0010's "a violation is normally caught before
      reaching the database" holds only because no production path requests a non-cancelled
      target. Behaviour is correct (the schema trigger stops it); the guard is declarative.
    suggestion: |
      Optional: narrow the port to a cancel-only operation, or route future status writes through
      WithStatus. Not required by any AC.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
