findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: question
    file: api/openapi.yaml
    line: 178
    title: "Implemented validation-before-key order contradicts the bookSlot contract's Idempotency/Slots paragraphs"
    description: |
      In scope: caused by internal/booking/booking.go:203-216 (this diff), which puts the resource,
      working-hours and shape rejections in front of insert-then-classify. api/openapi.yaml:178-188
      says "A request whose key is already stored is resolved from the stored booking ... any
      difference in that payload: 409 idempotency_key_conflict" and conditions 422
      slot_outside_working_hours on "A request whose key is not stored". After this diff a stored
      key reused with a different payload that is outside working hours (or names an unknown
      resource) gets 422 / 404, not 409; before this diff (CARD-005) it got 409. The new test
      internal/httpapi/validation_test.go:119 ("before opening" under stored K1, different slot)
      pins 422, i.e. pins behavior the published contract describes differently. The task contract
      and ADR-0020 ("keep the order of ADR-0011: validate, insert, classify") support the code, and
      the implementer recorded the choice in the card's STRUCTURE note — so this is an artifact
      conflict, not a code bug, but the contract (the source of truth for the API, contract-first)
      now misdescribes an observable, tested behavior, and nothing in the model records the
      resolution.
    suggestion: |
      Do not change the code. Reconcile the contract: amend api/openapi.yaml's bookSlot description
      (Idempotency: "after validation"; Slots: drop "whose key is not stored" or state the order;
      409 description) through forge:architect, or surface a DEC if the 409-first reading is wanted.
      Either way the card should not merge while the published contract and the pinned test disagree.
    confidence: medium
