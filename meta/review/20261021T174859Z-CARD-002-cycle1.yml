    file: internal/store/store.go
    line: 82
    title: "F-001 file: URI misroutes a path beginning with two slashes"
    description: |
      dsn() builds "file:" + escapePath(path). A valid POSIX path that begins with "//"
      (e.g. "//var/lib/booking.db", same file as "/var/lib/booking.db") becomes
      "file://var/lib/booking.db"; SQLite then parses "var" as the URI authority and refuses
      the open ("invalid uri authority"). Failure-matrix row F4 promises "the file opened is
      exactly the given path, 0 misrouted files"; this input breaks that claim (fails loudly,
      does not open a wrong file). Low likelihood: the path comes from operator config.
    suggestion: |
      For absolute paths emit an empty authority: "file://" + escapePath(path) when path starts
      with "/", or filepath.Clean the path first; add the case to
      TestOpen_PathWithURISpecialCharacters.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
