  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: internal/availability/availability.go
    line: 117
    title: "Interval semantics encoded a third time, as an enumeration that depends on half-hour alignment"
    description: |
      The CARD-007 follow-up asked whether availability introduces a third copy of the working-hours
      rule. It does, in a different form: `for m := iv.Start; m < iv.End; m += slotMinutes` re-encodes
      catalog.Interval's half-open [Start, End) reading with End = 24:00 (ADR-0004), next to
      catalog.Interval.validate and booking.insideWorkingHours. It is correct today (the property test
      TestProperty_Availability_ListsExactlyFreeSlotsInsideWorkingHours pins it against a containment
      oracle over 300 random schedules), but it silently assumes INV-005 alignment: with a misaligned End
      the loop would emit a slot crossing End. The implementer's note "no third copy of the
      slot-containment predicate" is accurate only for the predicate, not for the interval semantics.
    suggestion: |
      In the follow-up card that resolves CARD-007's insideWorkingHours item, add one catalog-owned
      operation (e.g. Interval.Slots or Resource.Contains) and have both booking and availability use it.
      Not fixable here without touching internal/catalog (outside Touches) or internal/booking (G-1).
    confidence: high
    source: static
    violates: null
