    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: internal/availability/property_test.go
    line: 172
    title: "EC clock-independence AST check only matches the identifier `time`"
    description: |
      assertNoSystemClock flags a SelectorExpr only when X is an Ident named "time". An aliased import
      (`import clk "time"`) or a dot-import would read the system clock without failing the
      EC(ADR-0013/R1) test. The rest of the property (repeat-equality over ranges decades in the past)
      would still catch a past filter, but not a clock read that does not change the output.
    suggestion: |
      Resolve the import path instead: collect the local names of imports whose path is "time" (and
      fail on a dot-import), then match SelectorExpr against that set.
    confidence: medium
