    type: risk
    file: internal/store/migrate.go
    line: 97
    title: "F-006 Negative user_version panics Open instead of returning an error"
    description: |
      PRAGMA user_version is a signed 32-bit integer. A database file whose user_version is
      negative (set by hand or by a foreign tool) passes the `current > len(ms)` guard at
      migrate.go:94 and reaches `ms[current:]` at migrate.go:97, a slice-bounds runtime panic.
      Open then crashes the process rather than returning an error and closing the pool
      (failure matrix promises an error on any failure). New in cycle 2 (not raised in cycle 1);
      code is patch-identical to cycle 1.
    suggestion: |
      Guard `current < 0` alongside the too-new check (return an error naming the version), and
      add a case to migrate_test.go next to TestMigrate_RejectsDatabaseNewerThanBinary.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: internal/store/store.go
    line: 85
    title: "F-001 file: URI misroutes a path beginning with two slashes"
    description: |
      Re-raised from cycle 1 (unchanged). dsn() builds "file:" + escapePath(path); a POSIX path
      beginning with "//" becomes "file://host/..." and SQLite reads the first segment as the
      URI authority and refuses the open. Fails loudly, never opens a wrong file. Operator-config
      input only.
    suggestion: |
      Emit "file://" + escapePath(path) for absolute paths (empty authority), or filepath.Clean
      first; add the case to TestOpen_PathWithURISpecialCharacters.
    confidence: medium
    source: static
    violates: null
