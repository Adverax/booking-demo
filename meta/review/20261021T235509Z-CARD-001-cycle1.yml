findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: bug
    file: internal/httpapi/server.go
    line: 44
    title: "JSON body with trailing data reaches the handler; declared failure-matrix row refuted"
    description: |
      The failure matrix declares: malformed JSON body on POST /resources and POST /bookings ->
      400 validation_error, handler not called (0 handler calls). The generated strict handler
      decodes with json.NewDecoder(r.Body).Decode(&body) (api.gen.go:926, :1033), which reads only
      the first JSON value. Reproduced on a scratch copy of HEAD: POST /bookings with body
      `<validBooking> garbage` or `<validBooking>{"x":1}` -> 201 and stub.called == "bookSlot".
      The body is not valid JSON, yet the handler runs. NewHandler (server.go:39-48) adds no guard,
      and TestNewHandler_MalformedBodyIsValidationError (server_test.go:170-178) has no
      trailing-data case.
    suggestion: |
      In NewHandler, for requests with a body, read it through the existing MaxBytesReader, reject
      with validation_error unless json.Valid(body) (MaxBytesError still maps to 413), then restore
      r.Body = io.NopCloser(bytes.NewReader(body)). Add `validBooking+" x"` and
      `validBooking+"{}"` to the malformed-body test table. Alternatively narrow the failure-matrix
      row, but the spec's "service enforces the same rules" makes rejection the consistent choice.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: internal/httpapi/server.go
    line: 40
    title: "Non-canonical paths get an undeclared 307 text/html redirect; property test masks it"
    description: |
      For //resources, /resources//availability or /resources/../resources, http.ServeMux returns a
      redirect handler with a non-empty pattern, so NewHandler forwards it and the client gets
      307 text/html (reproduced). The contract lists only 404/405/500 as path-level responses.
      TestProperty_EveryFailureIsJSONErrorWithDeclaredCode returns true for any status < 400
      (server_test.go:247), so it cannot catch this.
    suggestion: |
      Either answer redirects as 404 not_found (check the recorded status in writeRouteError style)
      or declare the behaviour in the spec description; make the property require 2xx-with-JSON or
      a declared error, not merely < 400.
    confidence: high
    source: static
    root_cause: RC-1
    status: open

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: api/openapi.yaml
    line: 340
    title: "ADR-0004 24:00 rule stated only by pattern, prose incomplete and untested"
    description: |
      The patterns (openapi.yaml:350, :355) encode the revised ADR-0004 correctly, but the prose
      says only "24:00 as end denotes the end of that day": it omits "exclusive", that a start may
      not be 24:00, and that no bound exceeds 24:00; the createResource description (:46-52) does
      not mention 24:00 at all. No contract test pins either pattern
      (TestContract_DeclaresInputConstraints, contract_test.go:192-225), so a regression of the
      24:00 rule in the spec would pass CI.
    suggestion: |
      State the three clauses in WorkingInterval / createResource prose, and assert in a contract
      test that start rejects 24:00 and end accepts 24:00 but rejects 24:30.
    confidence: high
    source: model
    root_cause: RC-2
    status: open

