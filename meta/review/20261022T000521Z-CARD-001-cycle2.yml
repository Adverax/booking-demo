    file: meta/kanban/cards/CARD-001.md
    line: 92
    title: "Failure-matrix memory bound says the body is held once, but the generated decoder buffers a second copy"
    description: |
      The oversized-body row declares "body held in memory once (< 2 MiB buffer capacity)". NewHandler
      keeps the io.ReadAll slice (server.go:68) and hands it to the generated decoder as a
      bytes.Reader; json.NewDecoder (api.gen.go:927, :1034) then copies the bytes into its own
      internal buffer, so a 1 MiB body occupies about two body-sized buffers plus the decoded value.
      Still bounded (O(body), well under a few MiB per request), so not a correctness or DoS defect;
      the declared figure is just inaccurate. In scope: the row and server.go are in the fix delta.
    suggestion: |
      Restate the bound as "about two body-sized buffers (read slice + decoder buffer), each <= 1 MiB + 1 B",
      or leave the code as is and correct only the declaration.
