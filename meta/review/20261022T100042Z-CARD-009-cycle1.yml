  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: cmd/booking/release_test.go
    line: 264
    title: "Test discovery ignores build constraints"
    description: |
      goTestFunctions parses every *_test.go below the module root without evaluating //go:build
      lines, so a planned test living only in a file excluded from `go test ./...` (e.g.
      //go:build ignore, or a GOOS tag) counts as existing although it never runs. No such file
      exists today (grep for go:build in *_test.go: 0 hits). Existence-only is the stated scope
      (NG-2), so this is a hardening note, not an AC failure.
    suggestion: |
      Use go/build.Context.MatchFile (default context) to skip files the go tool would not build,
      or refuse files carrying a build constraint.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: question
    file: cmd/booking/release_test.go
    line: 209
    title: "Coverage denominator is planned names, not rules"
    description: |
      AC-033's metric is rules_covered_by_a_named_test == 100%. The check collects every `test:`
      value it finds, so an acceptance criterion or EC added later WITHOUT a `test:` key is not
      counted at all and the check still passes. Today 66 AC/EC ids carry 66 test lines, so the
      metric holds; the reading "every planned name exists" (ADR-0022 decision text) and the
      reading "every rule has a name that exists" (NFR-003 metric) differ only on a future model.
      The model validator may already enforce a test per AC; not verified here.
    suggestion: |
      Either refuse an acceptance[]/engineering_constraints[] entry with no `test:` key, or record
      that the per-rule presence of a name is the model validator's job (ADR-0022 consequence).
    confidence: medium
    source: model
