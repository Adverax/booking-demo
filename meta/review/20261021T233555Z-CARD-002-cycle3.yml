    file: internal/store/migrate.go
    line: 97
    title: "F-006 Negative user_version panics Open instead of returning an error"
    description: |
      Re-raised from cycle 2 (code unchanged). PRAGMA user_version is a signed 32-bit integer.
      A database whose user_version is negative passes the `current > len(ms)` guard at
      migrate.go:94 and reaches `ms[current:]` at migrate.go:97, a slice-bounds runtime panic,
      so Open crashes instead of returning an error and closing the pool.
    suggestion: |
      Guard `current < 0` next to the too-new check and add a case beside
      TestMigrate_RejectsDatabaseNewerThanBinary (migrate_test.go:84).
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: internal/store/store.go
    line: 85
    title: "F-001 file: URI misroutes a path beginning with two slashes"
    description: |
      Re-raised (unchanged since cycle 1). dsn() builds "file:" + escapePath(path) at
      store.go:85; a POSIX path beginning with "//" becomes "file://host/..." and SQLite reads
      the first segment as the URI authority and refuses the open. Fails loudly at startup;
      operator-config input only.
    suggestion: |
      Emit "file://" + escapePath(path) for absolute paths (empty authority), or filepath.Clean
      first; add the case to TestOpen_PathWithURISpecialCharacters (store_test.go:143).
    confidence: medium
    source: static
