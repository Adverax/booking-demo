    title: "Failure-matrix memory bound says the body is held once, but the generated decoder buffers a second copy"
    description: |
      Still present after the rebase. The oversized-body row declares "body held in memory once
      (< 2 MiB buffer capacity)". NewHandler keeps the io.ReadAll slice (server.go:68) and passes it
      as a bytes.Reader (server.go:77); json.NewDecoder (api.gen.go:927, :1034) copies it into its own
      buffer, so a 1 MiB body occupies about two body-sized buffers. Still O(body) and bounded; the
      declared figure is inaccurate only. In scope: the card's failure matrix declares this diff's boundary.
    suggestion: |
      Restate the bound as "about two body-sized buffers (read slice + decoder buffer), each <= 1 MiB + 1 B".
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open

