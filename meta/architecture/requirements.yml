constraints:
  - id: CON-001
    type: technical
    statement: All times are stored and returned in UTC, in RFC 3339 format.
    source: design brief, 2026-10-21
  - id: CON-002
    type: technical
    statement: Go 1.26, standard library net/http for the HTTP layer.
    source: design brief, 2026-10-21
  - id: CON-003
    type: technical
    statement: SQLite is the only storage, through a pure-Go driver, no cgo.
    source: design brief, 2026-10-21
  - id: CON-004
    type: technical
    statement: JSON over HTTP; errors are a JSON object with a stable code field.
    source: design brief, 2026-10-21
  - id: CON-005
    type: technical
    statement: One binary, configured through environment variables.
    source: design brief, 2026-10-21
  - id: CON-006
    type: organizational
    statement: No authentication; the service runs behind the studio's own gateway.
    source: design brief, 2026-10-21
  - id: CON-007
    type: technical
    statement: The booking write path uses single autocommit statements and no transaction that reads and then writes.
    source: ADR-0012, 2026-10-21
    scope:
      contexts: [CTX-001]
    check:
      kind: review-lens
  - id: CON-008
    type: technical
    statement: Instants are stored as integer UTC epoch seconds and converted to RFC 3339 only at the API boundary; the current time is obtained through an injectable clock.
    source: ADR-0013, 2026-10-21
    scope:
      contexts: [CTX-001]
    check:
      kind: review-lens
