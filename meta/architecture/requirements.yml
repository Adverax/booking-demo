  - id: FR-006
    statement: >-
      Repeating a booking request with the same idempotency key and an identical payload (resource id,
      slot start, customer name) returns the original booking in its current state, also when it has
      been cancelled, and creates nothing new. Repeating a key with a different resource, slot or
      customer name is rejected with a stable error code and creates nothing. The idempotency key is
      globally unique across the service, not scoped per resource. When an insert violates a uniqueness
      constraint, the outcome is decided by reading the booking stored under the key: same payload
      returns the original, different payload is the key conflict, no stored booking means the slot was
      taken. Keys and customer names are compared byte for byte as received.
    source: [US-006]
    acceptance:
      - id: AC-021
        given: a booking for Monday 09:00 created with idempotency key K1
        when: the identical request is repeated with key K1
        then: the response is the original booking with the same booking id
        kind: idempotency
