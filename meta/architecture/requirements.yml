        then: the response is a not-found JSON error with a stable code field
        kind: negative
        test: TestCancelBooking_UnknownIdNotFound
      - id: AC-048
        given: a booking B1 that was already cancelled
        when: B1 is cancelled again by its id
        then: the response is a success carrying B1 with its original id and status cancelled
        kind: idempotency
        test: TestCancelBooking_RepeatedCancelReturnsCancelledBooking
    engineering_constraints:
      - id: EC-005
        statement: Cancelling a booking any number of times leaves it cancelled and returns it as a success every time
        kind: idempotency
        instances: [AC-048]
        test: TestProperty_Booking_RepeatedCancelIsIdempotent
    clarification:
      scope: "In: a second cancel of an already cancelled booking (ADR-0003). Out: any change to who may cancel (CON-006) or to the cancel rule for active bookings."
      actors: "Customer, through the studio frontend: a retried cancel behaves like the first one and needs no special case."
      error_alt_paths: "A repeated cancel is a success returning the cancelled booking (AC-048); an unknown id stays not-found (AC-027)."
      data: "No data change: the booking stays cancelled, nothing is reactivated."
      edge_cases: "The boundary is the second cancel of the same id; a third and later cancel behave the same (EC-005)."
      nfr: "No NFR moves (decision: unchanged)."
      dependencies: "CAP and trace.yml#FR-007 are in the impact radius; the response shape of a repeated cancel equals the first cancel response."
  - id: FR-008
    statement: >-
      A cancelled booking cannot be reactivated; a new booking is needed. The storage layer rejects
      the transition from cancelled back to active, not only the domain code.
    source: [US-007]
    acceptance:
      - id: AC-028
        given: a cancelled booking B1 for Monday 09:00
        when: a customer books Monday 09:00 with a new idempotency key
        then: a new booking B2 with a different id is created
        kind: happy
        test: TestBooking_NewBookingAfterCancelCreatesNewId
        invariant: INV-004
      - id: AC-029
        given: a cancelled booking B1 for Monday 09:00 and B2 now active for that slot
        when: B1 is read
        then: B1 status equals cancelled
        kind: boundary
        test: TestBooking_CancelledStaysCancelled
        invariant: INV-004
      - id: AC-030
        given: a cancelled booking B1
        when: any request attempts to set B1 active again
        then: the response is a conflict JSON error with a stable code field and B1 status stays cancelled
        kind: negative
        test: TestBooking_CannotReactivate
        invariant: INV-004
      - id: AC-049
        given: a cancelled booking B1 for Monday 09:00 whose slot has no active booking
        when: a statement updates the status of B1 to active directly in the database
        then: the update is aborted by the schema and B1 status stays cancelled
        kind: negative
        test: TestSchema_RejectsCancelledToActiveTransition
        invariant: INV-004
    clarification:
      scope: "In: enforcing cancelled-is-final in the schema (ADR-0010) besides the domain guard. Out: any public route that reactivates a booking (none exists, ASM-0001)."
      actors: "No actor sees a change: no endpoint reactivates a booking; the rule is a storage-level guard."
      error_alt_paths: "An update cancelled-to-active is aborted by the schema and mapped to a stable error (AC-049, AC-030)."
      data: "The booking status column gains a schema guard (trigger) in a versioned migration (ADR-0007); no new field."
      edge_cases: "The edge is a cancelled booking whose slot is free, where only the guard, not the active-slot index, stops the update (AC-049)."
      nfr: "No NFR moves (decision: unchanged)."
      dependencies: "AGG-002 INV-004, trace.yml#FR-008 and the migration set (ADR-0007) are in the impact radius; ASM-0001 is mostly settled by the storage-level test."

non_functional:
  - id: NFR-001
    # ADR-0021: a correctness release criterion (proof of INV-001 under concurrency), not a scalability
    # target. The fixed category list has no correctness value, so the closest honest one is operability,
    # the category of the other release criterion (NFR-002); scalability is not applicable (nfr_coverage).
    category: operability
    metric: successful_bookings_per_50_simultaneous_requests_for_one_slot
    threshold: exactly 1
    condition: 50 simultaneous booking requests for the same slot (release criterion)
    rationale: A correctness release criterion (ADR-0021), not a scale target; it proves the no-double-booking invariant (INV-001) under concurrency - 50 simultaneous requests for one slot resolve to exactly one winner. The brief states no load figure.
    acceptance:
      - id: AC-031
        given: a free future slot and a fresh database
        when: 50 simultaneous booking requests target that slot
        then: successful_bookings == 1
        kind: concurrency
        test: TestRelease_ConcurrencyExactlyOneWinner
    clarification:
      scope: "In: reclassifying NFR-001 as a correctness release criterion for INV-001 (ADR-0021). Out: any scale, throughput or latency target (the brief states none, ADR-0017)."
      actors: "No actor sees a change: the criterion is verified by the release test."
      error_alt_paths: "No change: the 49 losing requests get the slot-taken conflict already defined by FR-005 and FR-006."
      data: "No data change."
      edge_cases: "The 50-request count, the single winner and AC-031 are unchanged."
      nfr: "Category label changes from scalability to operability (the fixed list has no correctness value); the scalability category becomes not_applicable (no load figure in the brief)."
      dependencies: "trace.yml#NFR-001, CAP-003 and CARD-009 are in the impact radius; the trace and capability entries are not edited by this delta."
  - id: NFR-002
    category: operability
    metric: end_to_end_api_scenarios_passing_on_fresh_database
    threshold: 100%
    condition: the full API run against a freshly created database (release criterion)
    rationale: First-release criterion of the design brief.
    acceptance:
      - id: AC-032
        given: a fresh database
        when: the end-to-end scenario creates a resource, lists availability, books, repeats the booking and cancels
        then: end_to_end_api_scenarios_passing == 100%
        kind: happy
        test: TestRelease_FullAPIEndToEndOnFreshDatabase
  - id: NFR-003
    category: maintainability
    metric: rules_covered_by_a_named_test
    threshold: 100%
    condition: every rule of the design brief ("Rules that must always hold" and the stated FRs) (release criterion)
    rationale: First-release criterion of the design brief; every rule needs at least one named test. Verified by an executable check, not by the model's own claim - a Go release test reads the planned test names from the model and fails when a named test does not exist as a Go test function (ADR-0022).
    acceptance:
      - id: AC-033
        given: the list of rules and their linked test names in requirements.yml
        when: the Go release test TestRelease_EveryRuleHasANamedTest reads every planned test name from requirements.yml
        then: rules_covered_by_a_named_test == 100%, and the test fails when a named test is not a Go test function in the repository
        kind: boundary
        test: TestRelease_EveryRuleHasANamedTest
    clarification:
      scope: "In: naming the verification mechanism of AC-033 (ADR-0022): a Go release test reads the planned test names from the model and fails on a name that is not a Go test function. Out: judging whether a named test is meaningful (review does that)."
      actors: "No actor sees a change: the check runs with the ordinary test command and the delivery gates."
      error_alt_paths: "A missing, renamed or invalid test name fails the build instead of passing silently."
      data: "The test reads the model files under meta/architecture/; a schema change of the model can break it (ADR-0022 consequence)."
      edge_cases: "A name that is not a valid Go test function name (for example the old PropertyTest_ prefix) counts as missing."
      nfr: "No threshold moves: 100% stays; the mechanism is now executable and not a claim of the model."
      dependencies: "trace.yml#NFR-003 and CARD-009 are in the impact radius; reading YAML in Go may add a dependency with an allowlisted licence (ADR-0022)."

nfr_coverage:
  availability:
    status: surfaced
    ref: DEC-007
  compliance:
    status: surfaced
    ref: DEC-008
  cost:
    status: surfaced
    ref: DEC-009
  maintainability:
    status: covered
    refs: [NFR-003]
  observability:
    status: surfaced
    ref: DEC-010
  operability:
    status: covered
    refs: [NFR-002]
  performance:
    status: not_applicable
    reason: "ADR-0017: the brief states no latency or throughput figure and NFR-001 verifies correctness under concurrency only; revisit when the studio supplies a metric and a threshold"
  scalability:
    status: not_applicable
    reason: "ADR-0021: the brief states no load figure; NFR-001 is a correctness release criterion for INV-001, not a scalability target; revisit when the studio supplies a load figure"
  security:
    status: surfaced
    ref: DEC-011

constraints:
  - id: CON-001
    type: technical
    statement: All times are stored and returned in UTC, in RFC 3339 format.
    source: design brief, 2026-10-21
  - id: CON-002
    type: technical
    statement: Go 1.26, standard library net/http for the HTTP layer.
    source: design brief, 2026-10-21
  - id: CON-003
    type: technical
    statement: SQLite is the only storage, through a pure-Go driver, no cgo.
    source: design brief, 2026-10-21
  - id: CON-004
    type: technical
    statement: JSON over HTTP; errors are a JSON object with a stable code field.
    source: design brief, 2026-10-21
  - id: CON-005
    type: technical
    statement: One binary, configured through environment variables.
    source: design brief, 2026-10-21
  - id: CON-006
    type: organizational
    statement: No authentication; the service runs behind the studio's own gateway.
    source: design brief, 2026-10-21
  - id: CON-007
    type: technical
    statement: The booking write path uses single autocommit statements and no transaction that reads and then writes.
    source: ADR-0012, 2026-10-21
    scope:
      contexts: [CTX-001]
    check:
      kind: review-lens
  - id: CON-008
    type: technical
    statement: Instants are stored as integer UTC epoch seconds and converted to RFC 3339 only at the API boundary; the current time is obtained through an injectable clock.
    source: ADR-0013, 2026-10-21
    scope:
      contexts: [CTX-001]
    check:
      kind: review-lens
