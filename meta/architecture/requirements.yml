        invariant: INV-003
      - id: AC-022
        given: a booking created with idempotency key K1
        when: the identical request is repeated with key K1
        then: the total number of bookings stays 1
        kind: idempotency
        test: TestBookSlot_RepeatCreatesNothingNew
        invariant: INV-003
      - id: AC-023
        given: 10 simultaneous identical booking requests with the same idempotency key K1
        when: all are processed
        then: exactly 1 booking exists and all 10 responses carry the same booking id
        kind: concurrency
        test: TestBookSlot_ConcurrentRepeatsYieldOneBooking
        invariant: INV-003
      - id: AC-038
        given: a booking for Monday 09:00 by customer "Ann" created with idempotency key K1
        when: a request repeats key K1 for the same slot with customer name "Bob"
        then: the response is a key-conflict JSON error with a stable code field
        kind: negative
