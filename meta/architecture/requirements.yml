        invariant: INV-003
      - id: AC-042
        given: a booking B1 for Monday 09:00 created with key K1 and then cancelled
        when: the identical request is repeated with key K1
        then: the total number of bookings stays 1 and the Monday 09:00 slot is still listed as free
        kind: idempotency
        test: TestBookSlot_RepeatAfterCancelCreatesNoNewBooking
        invariant: INV-004
      - id: AC-043
        given: a booking for Monday 09:00 with key "Key-1" and a free Monday 09:30 slot
        when: customer "Ann" books Monday 09:30 with key "key-1", differing only by case
        then: a new booking for Monday 09:30 with a new id is persisted
        kind: boundary
        test: TestBookSlot_KeysDifferingOnlyByCaseAreDifferentKeys
        invariant: INV-003
      - id: AC-044
        given: a booking for Monday 09:00 with key "Key-1" and a free Monday 09:30 slot
        when: customer "Ann" books Monday 09:30 with key "Key-1 ", differing only by a trailing space
        then: a new booking for Monday 09:30 with a new id is persisted
        kind: boundary
        test: TestBookSlot_KeysDifferingOnlyByTrailingSpaceAreDifferentKeys
        invariant: INV-003
      - id: AC-045
        given: a booking for Monday 09:00 by customer "Ann" with key K1
        when: a request repeats key K1 for the same slot with customer name "ann"
        then: the response is a key-conflict JSON error with a stable code field
        kind: boundary
        test: TestBookSlot_CustomerNameComparisonIsCaseSensitive
        invariant: INV-003
      - id: AC-046
        given: a booking for Monday 09:00 by customer "Ann" with key K1
        when: a request repeats key K1 for the same slot with customer name "Ann " with a trailing space
        then: the response is a key-conflict JSON error with a stable code field
        kind: boundary
        test: TestBookSlot_CustomerNameComparisonDoesNotTrim
        invariant: INV-003
      - id: AC-047
        given: an active booking for Monday 09:00 stored under key K1
        when: another request with a new key K2 books the same slot
        then: the response is a slot-taken conflict JSON error and no booking is stored under key K2
        kind: negative
        test: TestBookSlot_SlotTakenStoresNothingUnderNewKey
        invariant: INV-001
    engineering_constraints:
      - id: EC-002
        statement: A booking request repeated with the same idempotency key and an identical payload (same resource id, slot start and customer name), in any number and at any time, never creates a second booking and returns the original
        kind: idempotency
        instances: [AC-021, AC-022]
        invariant: INV-003
        test: PropertyTest_Booking_IdempotentUnderRetry
      - id: EC-003
        statement: For any number of simultaneous requests sharing one idempotency key and an identical payload, exactly one booking is created and every response carries its id
        kind: concurrency
        instances: [AC-023]
        invariant: INV-003
        test: PropertyTest_Booking_ConcurrentSameKeyYieldsOneBooking
      - id: EC-004
        statement: A request that repeats an existing idempotency key with any differing resource id, slot start or customer name never creates a booking and never changes the stored one
        kind: idempotency
        instances: [AC-038, AC-039, AC-040]
        invariant: INV-003
        test: PropertyTest_Booking_KeyReuseWithDifferentPayloadCreatesNothing
    clarification:
      scope: "In: repeats of a key with a different payload (ADR-0001), repeats after cancellation (ADR-0002), the read-after-violation classification (ADR-0011), exact string comparison (ADR-0015); the identical-payload repeat is the only repeat that returns the original. Out: the order against the not-in-the-past check (DEC-012), empty or oversized keys (DEC-016), further concurrency scenarios (DEC-017)."
      actors: "Customer, through the studio frontend: a retry must resend the same key, resource, slot and name, and a new booking intent after a cancel needs a new key."
      error_alt_paths: "Different name, slot or resource under an existing key is a key-conflict error with a stable code and creates nothing (AC-038, AC-039, AC-040); a taken slot under a new key is a slot-taken conflict (AC-047); a repeat after cancel returns the cancelled original (AC-041, AC-042)."
      data: "No new fields; keys of cancelled bookings are kept forever (ADR-0002) and the key stays unique across all bookings, active or cancelled (ADR-0008)."
      edge_cases: "Keys differing only by case or trailing space are different keys (AC-043, AC-044); names differing only by case or trailing space are a payload mismatch (AC-045, AC-046)."
      nfr: "No NFR moves (decision: unchanged); the extra read after a violation touches no stated threshold."
      dependencies: "CAP-003 and trace.yml#FR-006 are the impact radius; INV-003, EC-002, EC-003 reworded and TERM-008 neighbours TERM-011..013 added; the key-conflict error code is chosen when the API is specified."
  - id: FR-007
    statement: >-
      A booking can be cancelled by anyone who knows its booking id; the service does not verify
      identity. A cancelled booking frees its slot immediately. Cancelling an already cancelled
      booking succeeds and returns the cancelled booking.
    source: [US-007]
    acceptance:
      - id: AC-024
        given: an active booking for Monday 09:00 made by customer "Ann"
        when: the booking is cancelled by its id
        then: the booking status equals cancelled
        kind: happy
        test: TestCancelBooking_MarksCancelled
      - id: AC-025
        given: Monday 09:00 booked and no free slot listed for it
        when: the booking is cancelled
        then: the next availability query lists the Monday 09:00 slot as free
        kind: happy
        test: TestCancelBooking_FreesSlotImmediately
      - id: AC-026
        given: an active booking made by customer "Ann"
        when: the cancel request carries no customer identity, only the booking id
        then: the booking is cancelled
        kind: authz
        test: TestCancelBooking_AnyoneWithIdCanCancel
      - id: AC-027
        given: no booking with id "missing-id" exists
        when: that booking is cancelled
        then: the response is a not-found JSON error with a stable code field
        kind: negative
        test: TestCancelBooking_UnknownIdNotFound
      - id: AC-048
        given: a booking B1 that was already cancelled
        when: B1 is cancelled again by its id
        then: the response is a success carrying B1 with its original id and status cancelled
        kind: idempotency
        test: TestCancelBooking_RepeatedCancelReturnsCancelledBooking
    engineering_constraints:
      - id: EC-005
        statement: Cancelling a booking any number of times leaves it cancelled and returns it as a success every time
        kind: idempotency
        instances: [AC-048]
        test: PropertyTest_Booking_RepeatedCancelIsIdempotent
    clarification:
      scope: "In: a second cancel of an already cancelled booking (ADR-0003). Out: any change to who may cancel (CON-006) or to the cancel rule for active bookings."
      actors: "Customer, through the studio frontend: a retried cancel behaves like the first one and needs no special case."
      error_alt_paths: "A repeated cancel is a success returning the cancelled booking (AC-048); an unknown id stays not-found (AC-027)."
      data: "No data change: the booking stays cancelled, nothing is reactivated."
      edge_cases: "The boundary is the second cancel of the same id; a third and later cancel behave the same (EC-005)."
      nfr: "No NFR moves (decision: unchanged)."
      dependencies: "CAP and trace.yml#FR-007 are in the impact radius; the response shape of a repeated cancel equals the first cancel response."
  - id: FR-008
    statement: >-
      A cancelled booking cannot be reactivated; a new booking is needed. The storage layer rejects
      the transition from cancelled back to active, not only the domain code.
    source: [US-007]
    acceptance:
      - id: AC-028
        given: a cancelled booking B1 for Monday 09:00
        when: a customer books Monday 09:00 with a new idempotency key
        then: a new booking B2 with a different id is created
        kind: happy
        test: TestBooking_NewBookingAfterCancelCreatesNewId
        invariant: INV-004
      - id: AC-029
        given: a cancelled booking B1 for Monday 09:00 and B2 now active for that slot
        when: B1 is read
        then: B1 status equals cancelled
        kind: boundary
        test: TestBooking_CancelledStaysCancelled
        invariant: INV-004
      - id: AC-030
        given: a cancelled booking B1
        when: any request attempts to set B1 active again
        then: the response is a conflict JSON error with a stable code field and B1 status stays cancelled
        kind: negative
        test: TestBooking_CannotReactivate
        invariant: INV-004
      - id: AC-049
        given: a cancelled booking B1 for Monday 09:00 whose slot has no active booking
        when: a statement updates the status of B1 to active directly in the database
        then: the update is aborted by the schema and B1 status stays cancelled
        kind: negative
        test: TestSchema_RejectsCancelledToActiveTransition
        invariant: INV-004
    clarification:
      scope: "In: enforcing cancelled-is-final in the schema (ADR-0010) besides the domain guard. Out: any public route that reactivates a booking (none exists, ASM-0001)."
      actors: "No actor sees a change: no endpoint reactivates a booking; the rule is a storage-level guard."
      error_alt_paths: "An update cancelled-to-active is aborted by the schema and mapped to a stable error (AC-049, AC-030)."
      data: "The booking status column gains a schema guard (trigger) in a versioned migration (ADR-0007); no new field."
      edge_cases: "The edge is a cancelled booking whose slot is free, where only the guard, not the active-slot index, stops the update (AC-049)."
      nfr: "No NFR moves (decision: unchanged)."
      dependencies: "AGG-002 INV-004, trace.yml#FR-008 and the migration set (ADR-0007) are in the impact radius; ASM-0001 is mostly settled by the storage-level test."

non_functional:
  - id: NFR-001
    category: scalability
    metric: successful_bookings_per_50_simultaneous_requests_for_one_slot
    threshold: exactly 1
    condition: 50 simultaneous booking requests for the same slot (release criterion)
    rationale: Concurrent bookings of one slot must resolve to exactly one winner; this drives the storage and locking design.
    acceptance:
      - id: AC-031
        given: a free future slot and a fresh database
        when: 50 simultaneous booking requests target that slot
        then: successful_bookings == 1
        kind: concurrency
        test: TestRelease_ConcurrencyExactlyOneWinner
  - id: NFR-002
    category: operability
    metric: end_to_end_api_scenarios_passing_on_fresh_database
    threshold: 100%
    condition: the full API run against a freshly created database (release criterion)
    rationale: First-release criterion of the design brief.
    acceptance:
      - id: AC-032
        given: a fresh database
        when: the end-to-end scenario creates a resource, lists availability, books, repeats the booking and cancels
        then: end_to_end_api_scenarios_passing == 100%
        kind: happy
        test: TestRelease_FullAPIEndToEndOnFreshDatabase
  - id: NFR-003
    category: maintainability
    metric: rules_covered_by_a_named_test
    threshold: 100%
    condition: every rule of the design brief ("Rules that must always hold" and the stated FRs) (release criterion)
    rationale: First-release criterion of the design brief; every rule needs at least one named test.
    acceptance:
      - id: AC-033
        given: the list of rules and their linked test names in requirements.yml
        when: the rule-to-test coverage check runs
        then: rules_covered_by_a_named_test == 100%
        kind: boundary
        test: TestRelease_EveryRuleHasANamedTest

