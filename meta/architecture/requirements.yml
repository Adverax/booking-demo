        invariant: INV-003
      - id: AC-040
        given: a booking of resource R1 for Monday 09:00 with key K1 and a free Monday 09:00 slot of resource R2
        when: a request repeats key K1 for resource R2 at Monday 09:00 with the same name
        then: the response is a key-conflict JSON error and R2 has 0 bookings
        kind: negative
        test: TestBookSlot_RepeatWithDifferentResourceIsKeyConflict
        invariant: INV-003
      - id: AC-041
