      start is earlier than the current time; a slot whose start equals the current time is accepted.
      A booking with an empty customer name is rejected with a stable error code and creates nothing.
      A request for a past slot whose idempotency key has no stored booking is rejected as a past
      slot and creates nothing; when the key is already stored, the repeat is resolved by FR-006 instead.
