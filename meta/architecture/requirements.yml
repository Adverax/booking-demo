functional:
  - id: FR-001
    statement: >-
      An operator creates a resource with a name and weekly working hours. Weekly working hours have at
      most one interval per weekday; interval bounds are aligned to the half hour and lie inside a
      single UTC day; resources that violate this are rejected with a stable error code.
    source: [US-001]
    acceptance:
      - id: AC-001
        given: no resources exist and a request with name "Dr. Lee" and working hours Mon-Fri 09:00-17:00 UTC
        when: the operator creates the resource
        then: the resource is persisted and returned with a generated id
        kind: happy
        test: TestCreateResource_Persists
      - id: AC-002
        given: a request with name "Dr. Lee" and no working hours
        when: the operator creates the resource
        then: the response is a 4xx JSON error with a stable code field and nothing is persisted
        kind: negative
        test: TestCreateResource_RejectsMissingWorkingHours
        invariant: INV-005
      - id: AC-003
        given: a request with an empty name and working hours Mon-Fri 09:00-17:00
        when: the operator creates the resource
        then: the response is a 4xx JSON error with a stable code field and nothing is persisted
        kind: negative
        test: TestCreateResource_RejectsEmptyName
        invariant: INV-005
      - id: AC-034
        given: a request with name "Dr. Lee" and two Monday intervals 09:00-12:00 and 13:00-17:00 UTC
        when: the operator creates the resource
        then: the response is a 4xx JSON error with a stable code field and nothing is persisted
        kind: negative
        test: TestCreateResource_RejectsTwoIntervalsOnOneWeekday
        invariant: INV-005
      - id: AC-035
        given: a request with name "Dr. Lee" and a Monday interval 09:15-17:00 UTC, the start not aligned to the half hour
        when: the operator creates the resource
        then: the response is a 4xx JSON error with a stable code field and nothing is persisted
        kind: boundary
        test: TestCreateResource_RejectsMisalignedIntervalBound
        invariant: INV-005
      - id: AC-036
        given: a request with name "Dr. Lee" and a Monday interval 22:00-02:00 UTC that crosses midnight
        when: the operator creates the resource
        then: the response is a 4xx JSON error with a stable code field and nothing is persisted
        kind: boundary
        test: TestCreateResource_RejectsIntervalCrossingMidnightUtc
        invariant: INV-005
    clarification:
      scope: "In: the shape of weekly working hours (ADR-0004) - one interval per weekday, half-hour aligned bounds, inside one UTC day, violations rejected with a stable code. Out: holidays, per-date exceptions, several intervals per day, a lunch break."
      actors: "Operator (ACT for resource creation) is the only actor whose behaviour changes; Customer and the studio frontend see only the resulting availability."
      error_alt_paths: "A request with two intervals on one weekday, a misaligned bound or an interval crossing midnight UTC is rejected with a 4xx JSON error carrying a stable code and nothing is persisted (AC-034, AC-035, AC-036)."
      data: "The weekly working-hours schema of AGG-001 Resource narrows to one interval per weekday; INV-005 states it. No event or ownership change."
      edge_cases: "Edges: a second interval on the same weekday, a bound off the half hour (09:15), an interval that ends before it starts across midnight (22:00-02:00)."
      nfr: "No NFR moves; the rule only adds validation and stays inside the existing categories (decision: unchanged)."
      dependencies: "CAP-001 and trace.yml#FR-001 are in the impact radius; slot derivation of FR-003 gets simpler (one interval check per day); no derivative needs rework now."
