        when: the identical request is repeated with key K1 after the slot has started
        then: the total number of bookings stays 1
        kind: idempotency
        test: TestBookSlot_RepeatAfterSlotStartedCreatesNothingNew
        invariant: INV-003
      - id: AC-056
        given: a booking B1 for Monday 09:00 by "Ann" created with key K1 while the injected clock read Monday 08:00 UTC, and the clock now reading Monday 09:00:01 UTC
        when: a request repeats key K1 for the same past slot with customer name "Bob"
        then: the response is a key-conflict JSON error with the code of ADR-0001, not the past-slot code
        kind: negative
        test: TestBookSlot_PastSlotRepeatWithDifferentPayloadIsKeyConflict
        invariant: INV-003
    engineering_constraints:
      - id: EC-002
        statement: A booking request repeated with the same idempotency key and an identical payload (same resource id, slot start and customer name), in any number and at any time (also after the slot has started), never creates a second booking and returns the original
        kind: idempotency
        instances: [AC-021, AC-022, AC-055, AC-058]
        invariant: INV-003
        test: TestProperty_Booking_IdempotentUnderRetry
      - id: EC-003
        statement: For any number of simultaneous requests sharing one idempotency key and an identical payload, exactly one booking is created and every response carries its id
        kind: concurrency
        instances: [AC-023]
        invariant: INV-003
        test: TestProperty_Booking_ConcurrentSameKeyYieldsOneBooking
      - id: EC-004
        statement: A request that repeats an existing idempotency key with any differing resource id, slot start or customer name (also for a slot that has already started) never creates a booking and never changes the stored one
        kind: idempotency
        instances: [AC-038, AC-039, AC-040, AC-056]
        invariant: INV-003
        test: TestProperty_Booking_KeyReuseWithDifferentPayloadCreatesNothing
    clarification:
      scope: "In: repeats of a key with a different payload (ADR-0001), repeats after cancellation (ADR-0002), the read-after-violation classification (ADR-0011), exact string comparison (ADR-0015); the identical-payload repeat is the only repeat that returns the original; an empty key is rejected (ADR-0018). the replay of a stored key after the slot has started (ADR-0020: the key is looked up when validation rejects a past slot). Out: a past slot with no stored key, which FR-005 owns (AC-057), oversized keys (API specification), further concurrency scenarios (DEC-017)."
      actors: "Customer, through the studio frontend: a retry must resend the same key, resource, slot and name, and a new booking intent after a cancel needs a new key."
      error_alt_paths: "Different name, slot or resource under an existing key is a key-conflict error with a stable code and creates nothing (AC-038, AC-039, AC-040); a taken slot under a new key is a slot-taken conflict (AC-047); a repeat after cancel returns the cancelled original (AC-041, AC-042); an empty key is a 4xx JSON error with a stable code and creates nothing (AC-053); after the slot has started, an identical repeat returns the original (AC-055, AC-058) and a different payload is the key conflict (AC-056)."
      data: "No new fields; keys of cancelled bookings are kept forever (ADR-0002) and the key stays unique across all bookings, active or cancelled (ADR-0008)."
      edge_cases: "Keys differing only by case or trailing space are different keys (AC-043, AC-044); names differing only by case or trailing space are a payload mismatch (AC-045, AC-046)."
      nfr: "No NFR moves (decision: unchanged); the extra read after a violation touches no stated threshold."
      dependencies: "CAP-003 and trace.yml#FR-006 are the impact radius; INV-003, EC-002, EC-003 reworded and TERM-008 neighbours TERM-011..013 added; the key-conflict error code is chosen when the API is specified."
