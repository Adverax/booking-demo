  - id: TERM-005
    term: Booking
    definition: "A customer's claim on one slot of a resource, made with a customer name and an idempotency key. Sameness of a repeated request is defined by its payload: it is the same only if resource id, slot start and customer name are equal (see Payload Comparison)."
    context: CTX-001
    aliases: []
    source: [US-005, US-006, US-007]
  - id: TERM-006
    term: Active Booking
    definition: "A booking that has not been cancelled; only active bookings occupy their slot. Overlap is defined by slot identity: two active bookings overlap only when they are in the same slot (see Slot Identity)."
    context: CTX-001
    aliases: []
    source: [US-004, US-007]
  - id: TERM-007
    term: Cancelled Booking
    definition: A booking that was cancelled; it frees its slot at once and can never be reactivated.
    context: CTX-001
    aliases: []
    source: [US-007]
  - id: TERM-008
    term: Idempotency Key
    definition: "A caller-supplied key, globally unique across the service, that makes a repeated booking request return the original booking. Sameness is defined by the exact string: two keys are the same key only if byte for byte equal (see Idempotency Key Comparison)."
    context: CTX-001
    aliases: []
