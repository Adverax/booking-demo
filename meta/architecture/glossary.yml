  - id: TERM-011
    term: Slot Identity
    definition: "Slot identity is defined by the resource id and the canonical UTC slot start of a Booking: two Resources are the same Resource when their ids are equal, and two bookings occupy the same Slot when both fields are equal, which is the overlap of two Active Bookings."
