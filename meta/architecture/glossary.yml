  - id: TERM-003
    term: Slot
    definition: "A 30-minute time interval of a resource, aligned to the half hour; the unit that is booked. Sameness is defined by resource id and canonical UTC slot start: two bookings are in the same slot when both are equal (see Slot Identity)."
    context: CTX-001
    aliases: []
