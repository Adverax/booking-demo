  - id: DEC-012
    question: >-
      A booking request repeats an existing idempotency key and its slot has meanwhile started or passed: should the key lookup run before the not-in-the-past validation (so the replay returns the original booking), or should validation run first (so the replay is rejected as past)? Raised by the critics as a contested reading of INV-002 and INV-003.
    surfaced_from:
      kind: ambiguity
      ref: [INV-002, INV-003, ADR-0002]
    alternatives:
      - label: lookup_first
        summary: "Look the key up before validating: a replay always returns the original booking, even when its slot has since started."
        pros: []
        cons: []
      - label: validate_first
        summary: "Validate the request first: a replay whose slot is now in the past is rejected as past."
        pros: []
        cons: []
    criteria_refs: [FR-005, FR-006]
    status: open
    blocks: [none]
  - id: DEC-013
    question: >-
      Should the rules created by ADR-0001..0004 be mirrored into the model now (reword INV-003 and INV-005, add acceptance criteria for the mismatching-key, repeat-after-cancel, repeated-cancel and malformed-working-hours paths), or left for later phases? Raised by the critics as a contested divergence between accepted ADRs and invariants/ACs.
    surfaced_from:
      kind: ambiguity
      ref: [INV-003, INV-005, ADR-0001, ADR-0004]
    alternatives:
      - label: mirror_now
        summary: "Reword INV-003 and INV-005 and add the missing ACs to requirements.yml now."
        pros: []
        cons: []
      - label: defer_to_later
        summary: "Keep requirements as extracted and add the ACs when cards are cut or tests are named."
        pros: []
        cons: []
    criteria_refs: [FR-001, FR-006, FR-007, NFR-003]
    status: open
    blocks: [none]
  - id: DEC-014
    question: >-
      An idempotent no-op (a repeated cancel under ADR-0003, a repeated booking with the same key under FR-006) succeeds without a state change: does it emit its domain event again, or none? Raised by the critics as contested for EVT-002 and EVT-003.
    surfaced_from:
      kind: ambiguity
      ref: [EVT-002, EVT-003, ADR-0003]
    alternatives:
      - label: no_event_on_noop
        summary: "Emit an event only when state actually changes; a no-op returns success silently."
        pros: []
        cons: []
      - label: event_on_every_success
        summary: "Emit the event on every successful command, including repeats."
        pros: []
        cons: []
    criteria_refs: [FR-006, FR-007]
    status: open
    blocks: [none]
